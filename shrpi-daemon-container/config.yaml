name: SH Rpi Daemon for Sailor HAT
slug: sh_rpi_daemon
version: "1.1.0"
description: >
  Safely shuts down Home Assistant when power is lost — fast enough to complete before supercapacitors drain. Uses direct dbus PowerOff for reliable filesystem protection.
url: https://github.com/eburi/ha_addon_sh_rpi_daemon
image: ghcr.io/eburi/ha_addon_sh_rpi_daemon/{arch}

arch:
  - aarch64

init: false
startup: services
hassio_api: true
hassio_role: manager
homeassistant_api: true
host_dbus: true

devices:
  - /dev/i2c-1
  - /dev/i2c/1

# Telemetry is published over MQTT discovery when a broker is available.
# "want" means the add-on still starts and shuts down correctly without one.
services:
  - mqtt:want

options:
  blackout_time_limit: 1.0
  blackout_voltage_limit: 9.0
  sensor_interval: 10

schema:
  blackout_time_limit: float(0.1,30.0)
  blackout_voltage_limit: float(5.0,31.0)
  sensor_interval: int(0,3600)
